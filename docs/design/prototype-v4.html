<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小胰宝工作台 · prototype v4</title>
<style>
:root{--paper:#fbf8f9;--ink:#382f35;--muted:#9a9096;--line:#eadfe4;--rose:#bd788d;--rose-soft:#f9edf1;--green:#5b9b81;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:#090909;padding:24px}.frame{height:calc(100vh - 48px);min-height:540px;max-width:1580px;margin:auto;background:white;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 80px #0005}.header{height:auto;min-height:48px;padding:6px 14px 6px 22px;background:#f8f5f6;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px;font-weight:700;color:#503b47}.logo{width:28px;height:28px;object-fit:contain;display:block}.version{padding:3px 9px;border-radius:999px;background:#eee9ec;color:#8d8189;font-size:11px;font-weight:500}.hint{flex:1 1 220px;min-width:140px;font-size:11.5px;color:#9a9096}.actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}.button{border:0;border-radius:999px;padding:7px 15px;background:var(--rose);color:white;font-size:12px;font-weight:700;cursor:pointer}.icon{border:1px solid var(--line);background:white;color:#68545e;border-radius:999px;padding:5px 10px;cursor:pointer}.workspace{display:flex;min-height:0;flex:1}.business{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--paper);overflow:auto}.nav{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:white;border-bottom:1px solid var(--line)}.crumb{font-size:13px;color:#665a61}.tools{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:white;color:#81757c;font-size:12px}.pill strong{color:#453a41;margin-left:5px}.pill-btn{border:1px solid var(--line);border-radius:12px;background:white;padding:10px 16px;font-size:14px;cursor:pointer}.content{max-width:1100px;padding:42px;}.eyebrow{color:#a14c66;font-weight:700;font-size:12px;letter-spacing:.14em}.content h1{font-size:36px;margin:6px 0}.content p{color:#8a8086}.card{margin-top:26px;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:760px}.chat{flex:none;background:#fff;min-width:300px;border-left:1px solid var(--line);display:flex;flex-direction:column}.splitter{width:8px;flex:none;cursor:col-resize;background:#faf6f8;border-left:1px solid #f1e9ed;border-right:1px solid #f1e9ed;touch-action:none}.splitter:focus{outline:3px solid var(--rose);outline-offset:-3px}.chat-head{padding:18px;border-bottom:1px solid var(--line);font-weight:700}.chat-body{padding:20px;color:#80757c;font-size:13px}.collapsed{display:none}@media(max-width:760px){body{padding:0}.frame{height:100vh;border-radius:0}.nav{height:auto;min-height:72px;align-items:flex-start;gap:10px;flex-direction:column;padding:14px}.tools{flex-wrap:wrap}.content{padding:24px}.content h1{font-size:28px}.chat{min-width:250px}}
</style></head>
<body><div class="frame" id="frame">
<header class="header"><div class="brand"><img class="logo" src="assets/xyb-logo.png" alt="小胰宝机器人"><span>小胰宝</span><span class="version">v0.1.29</span></div><span class="hint" id="hint">需要讨论资料时，打开右侧 DSH 原生会话。</span><div class="actions"><button class="button" id="toggle">打开 AI 对话</button><button class="icon collapsed" id="hide" aria-label="收起 AI 对话面板">×</button></div></header>
<div class="workspace"><main class="business"><nav class="nav"><div class="crumb">小胰宝工作台　/　收藏与回顾</div><div class="tools"><span class="pill"><i style="color:#e6a2b4">●</i> 资料目录 <strong>已激活</strong></span><span class="pill">● 对话 <strong>未进入激活</strong></span><button class="pill-btn">设置</button><button class="pill-btn">大字 Aa</button><span class="pill">v0.1.28</span></div></nav><section class="content"><div class="eyebrow">PINKYPAL / YOUR CARE COMPANION</div><h1>收藏与回顾</h1><p>重要的问题和结果，在需要的时候找得到。</p><div class="card"><strong>病情资料与照护记录</strong><p>工作台始终保留完整操作空间。打开对话后，可拖动中间分隔边调整宽度。</p><span class="pill">模拟数据 · DEMO-1</span></div></section></main><div class="splitter collapsed" id="splitter" role="separator" tabindex="0" aria-label="调整 AI 对话宽度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="45" aria-valuenow="35"></div><aside class="chat collapsed" id="chat"><div class="chat-head">DSH 原生 AI 对话</div><div class="chat-body">此处由 Desktop 提供真实会话界面。原型不代表已连接真实会话。</div></aside></div>
</div><script>
const frame=document.querySelector('#frame'),chat=document.querySelector('#chat'),splitter=document.querySelector('#splitter'),toggle=document.querySelector('#toggle'),hide=document.querySelector('#hide'),hint=document.querySelector('#hint');let width=Number(localStorage.getItem('v4-chat-width'))||35;function render(){chat.classList.remove('collapsed');splitter.classList.remove('collapsed');chat.style.width=width+'%';splitter.setAttribute('aria-valuenow',width);toggle.textContent='收起 AI 对话';hide.classList.remove('collapsed');hint.textContent='右侧为 DSH 原生会话；拖动分隔边调整宽度（25%–45%），收起不会结束会话。'}function close(){chat.classList.add('collapsed');splitter.classList.add('collapsed');toggle.textContent='打开 AI 对话';hide.classList.add('collapsed');hint.textContent='需要讨论资料时，打开右侧 DSH 原生会话。'}toggle.onclick=()=>chat.classList.contains('collapsed')?render():close();hide.onclick=close;let x=0,start=width;splitter.onpointerdown=e=>{x=e.clientX;start=width;splitter.setPointerCapture(e.pointerId)};splitter.onpointermove=e=>{if(!splitter.hasPointerCapture(e.pointerId))return;width=Math.max(25,Math.min(45,Math.round(start-(e.clientX-x)/frame.clientWidth*100)));chat.style.width=width+'%';splitter.setAttribute('aria-valuenow',width);localStorage.setItem('v4-chat-width',width)};splitter.onpointerup=e=>splitter.releasePointerCapture(e.pointerId);splitter.onkeydown=e=>{if(e.key==='ArrowLeft')width-=2;else if(e.key==='ArrowRight')width+=2;else if(e.key==='Home')width=25;else if(e.key==='End')width=45;else return;e.preventDefault();width=Math.max(25,Math.min(45,width));chat.style.width=width+'%';splitter.setAttribute('aria-valuenow',width);localStorage.setItem('v4-chat-width',width)};
</script></body></html>
